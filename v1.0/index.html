<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IMPACT+ Single File MVP</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
body{background:#f4f6f9}
.sidebar{position:fixed;left:0;top:0;width:240px;height:100vh;background:#0f172a;color:#fff;padding:15px}
.sidebar a{display:block;color:#fff;text-decoration:none;padding:10px;border-radius:6px}
.sidebar a:hover{background:#1e293b}
.main{margin-left:260px;padding:20px}
.page{display:none}
.page.active{display:block}
.card{margin-bottom:15px}
</style>
</head>
<body>
<div class="sidebar">
<h3>IMPACT+</h3>
<a href="#" onclick="showPage('login')">Login</a>
<a href="#" onclick="showPage('teacher')">Teacher Logger</a>
<a href="#" onclick="showPage('student')">Student Reflection</a>
<a href="#" onclick="showPage('observation')">Observation</a>
<a href="#" onclick="showPage('assessment')">Assessment</a>
<a href="#" onclick="showPage('school')">School Dashboard</a>
<a href="#" onclick="showPage('district')">District Dashboard</a>
</div>

<div class="main">

<div id="login" class="page active">
<h2>Login</h2>
<input class="form-control mb-2" placeholder="Email">
<input class="form-control mb-2" placeholder="Password" type="password">
<button class="btn btn-primary">Login</button>
</div>

<div id="teacher" class="page">
<h2>Teacher Session Logger</h2>
<input class="form-control mb-2" placeholder="Topic">
<select class="form-select mb-2">
<option>Khan Academy</option><option>DIKSHA</option><option>Byju's</option>
</select>
<textarea class="form-control mb-2" placeholder="Reflection"></textarea>
<button class="btn btn-success">Save Session</button>
</div>

<div id="student" class="page">
<h2>Student Reflection</h2>
<select class="form-select mb-2">
<option>Loved It</option><option>Okay</option><option>Difficult</option>
</select>
<textarea class="form-control mb-2" placeholder="What did you learn?"></textarea>
</div>

<div id="observation" class="page">
<h2>Classroom Observation</h2>
<label>Engagement</label>
<input type="range" class="form-range">
<label>Collaboration</label>
<input type="range" class="form-range">
<textarea class="form-control" placeholder="Observer Notes"></textarea>
</div>

<div id="assessment" class="page">
<h2>Assessment Tracking</h2>
<input class="form-control mb-2" placeholder="Pre-Test Score">
<input class="form-control mb-2" placeholder="Post-Test Score">
</div>

<div id="school" class="page">
<h2>School Dashboard</h2>
<div class="row">
<div class="col-md-3"><div class="card p-3"><h6>Students</h6><h3>500</h3></div></div>
<div class="col-md-3"><div class="card p-3"><h6>Teachers</h6><h3>30</h3></div></div>
</div>
<canvas id="schoolChart"></canvas>
</div>

<div id="district" class="page">
<h2>District Dashboard</h2>
<canvas id="districtChart"></canvas>
</div>

</div>

<script>
function showPage(id){
 document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
 document.getElementById(id).classList.add('active');
}
new Chart(document.getElementById('schoolChart'),{
type:'bar',
data:{labels:['Khan','DIKSHA','Byjus'],datasets:[{label:'Usage',data:[40,60,20]}]}
});
new Chart(document.getElementById('districtChart'),{
type:'radar',
data:{labels:['Engagement','Learning','Confidence','Teacher Practice'],
datasets:[{label:'Impact',data:[80,75,70,85]}]}
});
</script>
</body>
</html>
